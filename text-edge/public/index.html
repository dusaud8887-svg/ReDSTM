<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>텍스트 아카이브</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="/" aria-label="텍스트 아카이브 홈">TEXT / ARCHIVE</a>
      <span class="privacy">개인 열람 · 비공개</span>
    </header>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">YOUR PERSONAL LIBRARY</p>
        <h1 id="page-title">오래 읽기 위한<br>작은 서재</h1>
        <p class="lede">출처와 본문을 분리해 보존한 텍스트를 읽습니다.</p>
      </section>
      <nav class="lanes" aria-label="자료 종류">
        <button class="lane is-active" data-lane="novel" aria-pressed="true">소설 <span>01</span></button>
        <button class="lane" data-lane="arcalive" aria-pressed="false">아카라이브 <span>02</span></button>
      </nav>
      <section class="library" aria-live="polite">
        <div class="toolbar">
          <div>
            <p class="eyebrow" id="lane-label">NOVEL INDEX</p>
            <h2 id="section-title">작품</h2>
          </div>
          <label class="search"><span class="sr-only">제목 검색</span><input id="search" type="search" placeholder="제목 검색" autocomplete="off"></label>
        </div>
        <p id="status" class="status" role="status">목록을 불러오는 중…</p>
        <div class="layout">
          <ul id="items" class="items" aria-label="자료 목록"></ul>
          <article id="reader" class="reader" aria-label="본문"></article>
        </div>
      </section>
    </main>
    <footer><span>RELEASED TEXT ONLY</span><span id="release-date">No release loaded</span></footer>
  </body>
</html>
