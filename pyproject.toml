[project]
name = "redstm"
version = "0.1.0"
description = "Personal TypeMoon archive and reader"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Scrapy>=2.17.0,<2.18",
    "filelock>=3.20,<4",
    "nh3>=0.3.6,<0.4",
    "warcio>=1.8.1,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.15.21,<0.16",
]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
