name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen
      - name: Reproduce pinned web font assets
        run: |
          npm ci --prefix edge
          npm run fonts --prefix edge
          git diff --exit-code -- edge/public/fonts
          test -z "$(git ls-files --others --exclude-standard edge/public/fonts)"
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy crawler scripts tests

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - run: npx playwright install --with-deps chrome
      # Only screens without a committed baseline get one (a new or intentionally changed screen,
      # whose old PNG was removed); the run's artifact carries them to commit.
      - name: Generate missing Linux visual baselines
        # Writing a missing baseline marks that test failed; the comparison run below decides.
        continue-on-error: true
        run: npx playwright test --project visual --update-snapshots=missing
        env:
          VISUAL: "1"
      - run: npm run test:e2e
        env:
          VISUAL: "1"
      - name: Upload Linux visual baselines and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edge-visual-linux
          path: |
            edge/e2e/visual.spec.js-snapshots
            edge/test-results
      - name: Validate empty and existing-schema D1 migrations
        run: npm run test:d1
      - run: npx wrangler deploy --dry-run --strict

  text-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: text-edge
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: text-edge/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run deploy:dry-run
