<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>ReDSTM 이미지 보관</title>
  <style>
    body { width: 300px; margin: 0; padding: 14px; font: 13px/1.5 system-ui, "Malgun Gothic", sans-serif; color: #15171a; }
    h1 { margin: 0 0 8px; font-size: 15px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0 0 12px; }
    dt { color: #4b5565; }
    dd { margin: 0; font-variant-numeric: tabular-nums; }
    button { width: 100%; min-height: 40px; border: 0; border-radius: 8px; background: #d92d3d; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; }
    label { display: flex; align-items: center; gap: 6px; margin: 10px 0; }
    input[type="url"] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cdd2da; border-radius: 6px; font: inherit; }
    .message { margin: 8px 0 0; color: #b42318; }
    small { color: #7c8798; }
  </style>
</head>
<body>
  <h1>ReDSTM 이미지 보관</h1>
  <dl>
    <dt>대기</dt><dd id="pending">—</dd>
    <dt>완료</dt><dd id="done">—</dd>
    <dt>실패</dt><dd id="failed">—</dd>
    <dt>마지막 실행</dt><dd id="last">—</dd>
  </dl>
  <button id="run" type="button">지금 수집</button>
  <p class="message" id="message" hidden></p>
  <label><input id="auto" type="checkbox"> 10분마다 자동 수집</label>
  <label for="base">ReDSTM 주소</label>
  <input id="base" type="url">
  <p><small>아카라이브와 ReDSTM에 이 크롬으로 로그인되어 있어야 합니다. 읽은 글의 이미지부터 받아 옵니다.</small></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
