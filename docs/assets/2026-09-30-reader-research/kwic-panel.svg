<text x="24" y="114" font-size="11" fill="#7C8798">1화</text><text x="696" y="114" font-size="11" fill="#7C8798" text-anchor="end">180화</text>
<text x="360.0" y="114" font-size="11" fill="#7C8798" text-anchor="middle">회차별 등장 분포(Bubblelines 축약, 바코드와 같은 x축)</text>
<text x="24" y="150" font-size="12" fill="#4B5565">3화</text><text x="332" y="150" font-size="14" fill="#15171A" text-anchor="end">문을 열자</text><rect x="336" y="135" width="18" height="20" rx="3" fill="#FFF1F2"/><text x="338" y="150" font-size="14" fill="#15171A"><tspan font-weight="700">린</tspan><tspan>이 고개를 들었다. "늦었…</tspan></text><line x1="24" y1="162" x2="696" y2="162" stroke="#E7E9EE"/><text x="24" y="186" font-size="12" fill="#4B5565">3화</text><text x="332" y="186" font-size="14" fill="#15171A" text-anchor="end">…그렇게 말하며</text><rect x="336" y="171" width="18" height="20" rx="3" fill="#FFF1F2"/><text x="338" y="186" font-size="14" fill="#15171A"><tspan font-weight="700">린</tspan><tspan>은 창밖을 내다보았다.</tspan></text><line x1="24" y1="198" x2="696" y2="198" stroke="#E7E9EE"/><text x="24" y="222" font-size="12" fill="#4B5565">17화</text><text x="332" y="222" font-size="14" fill="#15171A" text-anchor="end">"</text><rect x="331" y="207" width="18" height="20" rx="3" fill="#FFF1F2"/><text x="333" y="222" font-size="14" fill="#15171A"><tspan font-weight="700">린</tspan><tspan>, 거기 있어?" 대답은 없었다.</tspan></text><line x1="24" y1="234" x2="696" y2="234" stroke="#E7E9EE"/><text x="24" y="258" font-size="12" fill="#4B5565">42화</text><text x="332" y="258" font-size="14" fill="#15171A" text-anchor="end">…돌아선</text><rect x="336" y="243" width="18" height="20" rx="3" fill="#FFF1F2"/><text x="338" y="258" font-size="14" fill="#15171A"><tspan font-weight="700">린</tspan><tspan>의 목소리가 떨렸다.</tspan></text><line x1="24" y1="270" x2="696" y2="270" stroke="#E7E9EE"/><text x="24" y="300" font-size="11" fill="#7C8798">줄을 누르면 그 회차를 같은 독서 세션(replace)으로 열고, 본문 찾기 Highlight로 그 위치에 이동</text>
</svg>